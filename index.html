    <script>
      // Theme pre-paint: resolve the saved mode (auto / light / dark) before
      // first paint so there is no flash of the wrong theme. Auto follows
      // the system setting. A pre-Auto saved choice ("kopabook-theme") is
      // honoured as the mode.
      (function () {
        try {
          var m = localStorage.getItem("kopabook-theme-mode");
          if (m !== "auto" && m !== "light" && m !== "dark") {
            var old = localStorage.getItem("kopabook-theme");
            m = (old === "light" || old === "dark") ? old : "auto";
          }
          var t = m === "auto"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : m;
          var d = document.documentElement;
          d.setAttribute("data-theme", t);
          d.setAttribute("data-theme-mode", m);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-theme-mode", "auto");
        }
      })();
    </script>

    <!-- FVAChat: merged chat by FVA70K Services. Signed in: Ask Kopa AI + Kopa Support. Signed out: Kopa Support bot.
         Speed (Phase 6.2, 2026-11-17): lazy-loaded, so the 124 kB chat
         script plus its stylesheet no longer download on every cold open
         or compete with first paint. The loader below injects the same
         script with the same data-* config on first user interaction or
         when the browser is idle (2.5 s fallback), whichever comes first.
         fvachat.js reads its config off document.currentScript, which is
         set for dynamically inserted scripts while they execute, and it
         reads window.FVAChatOwner live when it needs the owner context,
         so loading after App.jsx already called setFVAChatOwner is safe.
         The inline owner-context script below is untouched and still
         runs first. -->
    <script>
      // Owner context for the merged chat. The server verifies this against the signed-in session before trusting it.
      window.FVAChatOwner = null;
      window.setFVAChatOwner = function(ctx) { window.FVAChatOwner = ctx; };
    </script>
    <script>
      // FVAChat lazy loader (Phase 6.2): inject /fvachat.js only when it
      // is needed, so first paint never waits on the chat widget.
      (function () {
        var loaded = false;
        function loadChat() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement("script");
          s.src = "/fvachat.js";
          s.setAttribute("data-site-id", "kopabook");
          s.setAttribute("data-business", "Kopa Support");
          s.setAttribute("data-bot-name", "Kopa Bot");
          s.setAttribute("data-color", "#15803d");
          document.body.appendChild(s);
        }
        function arm() {
          if (loaded) return;
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadChat, { timeout: 2500 });
          } else {
            window.setTimeout(loadChat, 2000);
          }
          var once = function () { loadChat(); };
          ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
            window.addEventListener(ev, once, { once: true, passive: true });
          });
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", arm);
        } else {
          arm();
        }
      })();
    </script>
  </body>
