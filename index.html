<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15803d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KopaBook" />

    <title>KopaBook - Simple Sales, Stock and Debt Tracking for Nigerian Businesses</title>

  <body>
    <div id="root"></div>
    <script>
      try {
        var t = localStorage.getItem("kopabook-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- FVAChat: AI support chat by FVA70K Services -->
    <script>
      // Owner context for Kopa Bot business copilot
      window.FVAChatOwner = null;
      window.setFVAChatOwner = function(ctx) { window.FVAChatOwner = ctx; };
    </script>
    <script src="/fvachat.js"
      data-site-id="kopabook"
      data-business="KopaBook Support"
      data-bot-name="Kopa Bot"
      data-color="#15803d"></script>
  </body>
</html>
